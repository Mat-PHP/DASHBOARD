[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financas-em-foco"
version = "1.0.0"
description = "Dashboard financeiro pessoal, interativo e local-first."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["finance_dashboard"]

