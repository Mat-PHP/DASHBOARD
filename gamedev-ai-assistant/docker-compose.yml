services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -m app.seed.seed_database && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: gamedev_ai
      FRONTEND_URL: http://localhost:5173
      AI_PROVIDER: mock
    ports: ["8000:8000"]
    depends_on: [mongodb]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    environment: ["VITE_API_URL=http://localhost:8000/api"]
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongodb_data:
